[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-scrapper"
version = "0.1.0"
description = "Telegram bot that detects job-ad links in a group, crawls an allowlist of sites, and writes structured results to Google Sheets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "gspread>=6.0",
    "google-auth>=2.30",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
job-scrapper = "job_scrapper.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_scrapper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
